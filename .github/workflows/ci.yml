name: CI

# Build verification. The framework expects its dependencies as
# workspace siblings (snore_core at ../snore_core, godot-cpp at
# ../godot-cpp, etc. — see build_utils.py post-Phase 2.5), so this
# workflow recreates that layout in the runner by checking out each
# sibling into the runner workspace root.
#
# What this catches: changes to surfacer that break compilation
# under sc_ci=yes sc_dev=yes sc_tests=yes. It does NOT run tests yet
# (those need a Godot binary against the demo project — followup).

on:
  # Cost-conscious trigger set (matches hopnbop_private's pattern):
  # active dev work pushes to `dev` and does NOT trigger CI; the
  # daily schedule + integration pushes to the slim default branches
  # do.
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 4 * * *'  # 04:00 UTC daily
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Linux, x86_64, debug)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout surfacer
        uses: actions/checkout@v4
        with:
          path: surfacer

      - name: Checkout snore_core (private)
        uses: actions/checkout@v4
        with:
          repository: SnoringCatGames/snore_core
          ref: dev
          token: ${{ secrets.PRIVATECHECKOUTACCESSTOKEN }}
          path: snore_core

      - name: Checkout godot-cpp (4.4)
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot-cpp
          ref: '4.4'
          path: godot-cpp

      - name: Checkout googletest
        uses: actions/checkout@v4
        with:
          repository: google/googletest
          path: googletest

      - name: Compute cache key inputs
        id: cache_inputs
        # Cache key components: godot-cpp's actual commit SHA (catches
        # branch shifts on upstream) and the runner's GCC major.minor
        # (catches runner-image refreshes that bump the compiler ABI).
        # Bump the trailing -v<n> in the cache key to force a clean
        # rebuild if cache poisoning is ever suspected.
        run: |
          echo "godot_cpp_sha=$(git -C godot-cpp rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "gcc_version=$(gcc -dumpversion)" >> "$GITHUB_OUTPUT"

      - name: Cache godot-cpp build artifacts
        uses: actions/cache@v4
        with:
          path: |
            godot-cpp/bin
            godot-cpp/gen
            godot-cpp/.sconsign.dblite
            godot-cpp/src/**/*.os
          key: godot-cpp-${{ runner.os }}-gcc${{ steps.cache_inputs.outputs.gcc_version }}-${{ steps.cache_inputs.outputs.godot_cpp_sha }}-v1
          restore-keys: |
            godot-cpp-${{ runner.os }}-gcc${{ steps.cache_inputs.outputs.gcc_version }}-
            godot-cpp-${{ runner.os }}-

      - name: Install SCons
        run: |
          python3 -m pip install --upgrade pip
          pip3 install scons

      - name: Build surfacer (CI mode, dev features + tests)
        working-directory: surfacer
        # sc_ci=yes disables Clang/MSVC-only __builtin_debugtrap on GCC.
        # sc_dev=yes turns on dev-gated code. sc_tests=yes compiles
        # tests + links googletest.
        run: scons sc_ci=yes sc_dev=yes sc_tests=yes

      - name: Verify artifact landed in addon/bin
        working-directory: surfacer
        run: |
          set -e
          ls -lR addon/bin/
          find addon/bin -name 'libSurfacer.*.so' -o -name 'libSurfacer.*.dylib' \
              | grep -q . || (echo 'No shared library produced.'; exit 1)
